[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "post-processing-magic"
version = "0.26.0"
description = "Windows launcher and local web service for forensic post-processing"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyinstaller>=6.22.1,<7"]

[project.scripts]
post-processing-magic = "forensic_app.launcher:main"

[tool.setuptools.package-data]
forensic_app = ["web/*.html","assets/*.ico"]

[tool.setuptools.packages.find]
include = ["forensic_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

